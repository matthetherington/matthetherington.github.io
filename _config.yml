title: Matt Hetherington
tagline: "Thoughts, reflections, and interesting tidbits I've ran into."
description: Notes on software, Linux, and projects in progress.
url: "https://matthetherington.github.io"
baseurl: ""
lang: en
timezone: Etc/UTC
github:
  username: matthetherington
twitter:
  username: ""
social:
  name: Matt Hetherington
  email: ""
  links:
    - https://github.com/matthetherington
    - https://gist.github.com/matthetherington

theme: jekyll-theme-chirpy
# Keep this unset: forcing "dark" here would remove Chirpy's theme selector.
# _includes/metadata-hook.html provides a first-visit dark default instead.
theme_mode:
avatar: ""
cdn: ""
toc: true
paginate: 10

comments:
  provider: ""
analytics:
  google:
    id: ""
pageviews:
  provider: ""

# Keep downloadable scripts out of an offline service-worker cache.
pwa:
  enabled: false
  cache:
    enabled: false

assets:
  self_host:
    enabled: false

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-archives
  - jekyll-include-cache

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /posts/:title/
      comments: false
      toc: true
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    category: /categories/:name/
    tag: /tags/:name/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - NOTICE.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - scripts
  - tests
  - vendor
